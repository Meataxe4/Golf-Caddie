    <title>AI Golf Caddie</title>
    <style>
      /* Critical Leaflet tile CSS — ensures tiles render even if stylesheet fails */
      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer { position: absolute; left: 0; top: 0; }
      .leaflet-container { overflow: hidden; }
      .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
      .leaflet-tile { filter: inherit; visibility: inherit; }
      .leaflet-tile-container { pointer-events: none; }
      .leaflet-map-pane { z-index: 0; }
      .leaflet-tile-pane { z-index: 200; }
      .leaflet-overlay-pane { z-index: 400; }
      .leaflet-shadow-pane { z-index: 500; }
      .leaflet-marker-pane { z-index: 600; }
      .leaflet-tooltip-pane { z-index: 650; }
      .leaflet-popup-pane { z-index: 700; }
      .leaflet-container { background: #091510; }
      .leaflet-tile-pane img { max-width: none !important; max-height: none !important; }
      .leaflet-container img { max-width: none !important; max-height: none !important; }
      .leaflet-container img.leaflet-image-layer { max-width: none !important; max-height: none !important; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #0d1f17;
        color: #e8f0e8;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      input, select, textarea { user-select: text; -webkit-user-select: text; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
      @keyframes loadingPulse { 0% { width: 20%; } 50% { width: 80%; } 100% { width: 20%; } }
    </style>
